<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YELLOW V1</title>

    <script>
        // ========================================================
        // SISTEMA DE SEGURIDAD OBLIGATORIO (Al inicio del HEAD)
        // ========================================================
        (function() {
            var contrasenaCorrecta = "1998";
            var intento = prompt("Por seguridad, introduce la contraseña para acceder a YELLOW V1:");

            if (intento !== contrasenaCorrecta) {
                alert("Contraseña incorrecta. Acceso denegado consigue tu key.");
                window.location.replace("about:blank");
            } else {
                alert("¡Acceso concedido! Bienvenido.");
            }
        })();
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #001f3f, #0074D9) !important;
            color: white !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #FF4136;
            text-shadow: 0px 0px 15px rgba(255, 65, 54, 0.8);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .contenedor-juego {
            border: 4px solid #FF4136;
            box-shadow: 0px 0px 20px #FF4136;
            border-radius: 15px;
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto 10px auto;
            background: #000000;
        }

        iframe {
            width: 100%;
            height: 550px;
            border: none;
            display: block;
            background: #000000;
        }

        .barra-volumen {
            max-width: 800px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 65, 54, 0.3);
        }

        .btn-vol {
            background: #111;
            color: #fff;
            border: 2px solid #FF4136;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .btn-vol:hover {
            background: #FF4136;
            color: black;
        }

        .contenedor-chat {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: rgba(0, 0, 0, 0.75) !important;
            border: 3px solid #FF4136;
            box-shadow: 0px 0px 15px rgba(255, 65, 54, 0.5);
            border-radius: 12px;
            padding: 15px;
        }

        #caja-mensajes {
            height: 250px;
            overflow-y: auto;
            border: 1px solid #FF4136;
            border-radius: 8px;
            padding: 10px;
            text-align: left;
            background: #050505 !important;
            margin-bottom: 15px;
        }

        .mensaje {
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            color: white;
        }

        .usuario { color: #7FDBFF; font-weight: bold; }
        .texto { color: #FF4136; }

        .controles {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input {
            background: #111;
            border: 2px solid #7FDBFF;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
        }

        #userInput { width: 30%; }
        #textInput { width: 70%; }

        .contenedor-musica {
            max-width: 800px;
            margin: 20px auto;
            background: rgba(0,0,0,0.8) !important;
            border: 2px solid #7FDBFF;
            box-shadow: 0px 0px 15px #7FDBFF;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
        }

        .lista-videos {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .video-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(127, 219, 255, 0.2);
        }

        .video-item h4 {
            margin: 0 0 10px 0;
            color: #7FDBFF;
            text-align: left;
            font-size: 1rem;
        }

        .btn-emergencia {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- Nombre principal de la web corregido -->
    <h1>YELLOW V1 Premium</h1>

    <div class="contenedor-juego">
        <iframe src="https://www.hoodamath.com"></iframe>
    </div>

    <div class="barra-volumen">
        <button class="btn-vol" onclick="alert('Usa los controls dentro del menú')">🔉 Vol -</button>
        <button class="btn-vol" onclick="alert('Clic derecho en la pestaña para mutar')">🔇 Mutar</button>
        <button class="btn-vol" onclick="alert('Sube el volumen desde tu PC')">🔊 Vol +</button>
    </div>

    <!-- El chat original intacto, sin botones de borrar -->
    <div class="contenedor-chat">
        <div id="caja-mensajes"></div>

        <div class="controles">
            <input type="text" id="userInput" placeholder="Tu Apodo...">
            <input type="text" id="textInput" placeholder="Escribe tu mensaje aquí y presiona Enter...">
        </div>
    </div>

    <div class="contenedor-musica">
        <h3 style="color: #7FDBFF; margin-top: 0; margin-bottom: 5px;">🎵 Radio & Lista Musical Premium</h3>
        <p style="font-size: 0.85rem; color: #aaa; margin: 0;">Escucha música sin bloqueos escolares</p>
         
        <div class="lista-videos">
             
            <!-- Reproductor directo antibloqueo -->
            <div class="video-item">
                <h4>🔥 Video 1: Monalisa - La Santa Grifa</h4>
                <audio controls style="width: 100%; margin-top: 10px;">
                    <source src="https://pub-2f92d4a238714ff98da5bede66b44b11.r2.dev/Monalisa.mp3" type="audio/mpeg">
                    Tu navegador no soporta este reproductor.
                </audio>
            </div>

        </div>
    </div>

    <button class="btn-emergencia" onclick="window.location.replace('about:blank');">❌ Enlace roto</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDcLm48oGpY4-gF-VBPwOcfTSHniWQ_KSI",
            authDomain: "pagina-yellow.firebaseapp.com",
            databaseURL: "https://pagina-yellow-default-rtdb.firebaseio.com",
            projectId: "pagina-yellow",
            storageBucket: "pagina-yellow.appspot.com",
            messagingSenderId: "908196257959",
            appId: "1:908196257959:web:ecf110e98ecdbe5778c812"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("mensajes_chat");

        const cajaMensajes = document.getElementById("caja-mensajes");
        const userInput = document.getElementById("userInput");
        const textInput = document.getElementById("textInput");

        window.onload = function() {
            let nombreGuardado = localStorage.getItem('apodoGamer');
            if (nombreGuardado) {
                userInput.value = nombreGuardado;
                userInput.disabled = true;
            }
        };

        function enviarMensaje() {
            let usuario = userInput.value.trim() || "Anónimo";
            let textoMensaje = textInput.value.trim();
            
            if (!textoMensaje) return;

            // Único comando secreto nativo para resetear tu nombre local
            if (textoMensaje === '/clear-names') {
                localStorage.removeItem('apodoGamer');
                userInput.value = '';
                userInput.disabled = false;
                textInput.value = '';
                alert('¡Nombre reseteado con éxito!');
                return;
            }

            if (usuario !== "Anónimo" && !localStorage.getItem('apodoGamer')) {
                localStorage.setItem('apodoGamer', usuario);
                userInput.disabled = true;
            }

            db.push({
                usuario: usuario,
                texto: textoMensaje,
                tiempo: Date.now()
            });

            textInput.value = "";
        }

        textInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") { enviarMensaje(); }
        });

        db.limitToLast(50).on("child_added", function(snapshot) {
            let datos = snapshot.val();
            if (datos.texto === '/clear-names') return;
            
            let divMsg = document.createElement("div");
            divMsg.className = "mensaje";
            divMsg.innerHTML = `<span class="usuario">[${datos.usuario}]:</span> <span class="texto">${datos.texto}</span>`;
            
            cajaMensajes.appendChild(divMsg);
            cajaMensajes.scrollTop = cajaMensajes.scrollHeight;
        });
    </script>
</body>
</html>
