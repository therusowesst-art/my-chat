<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify – Web Player: Music for everyone</title>

    <script>
        // ========================================================
        // SISTEMA DE SEGURIDAD (Contraseña: 1998)
        // ========================================================
        (function() {
            var llaveOculta = "MTk5OA=="; 
            var intento = prompt("Se requiere autenticación de cuenta de música:");

            if (!intento || btoa(intento) !== llaveOculta) {
                window.location.replace("about:blank"); 
            }
        })();
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            /* El color gris oscuro de fondo oficial de Spotify */
            background-color: #121212;
            /* Cambiamos las telarañas por un diseño liso y limpio como la app */
            color: #FFFFFF;
            font-family: 'Circular', Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            /* Verde oficial de Spotify */
            color: #1DB954;
            font-size: 2rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .contenedor-juego {
            border: 2px solid #282828;
            border-radius: 8px;
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto 10px auto;
            background: #000000;
        }

        iframe {
            width: 100%;
            height: 550px;
            border: none;
            display: block;
            background: #000000;
        }

        .barra-volumen {
            max-width: 800px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #181818;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #282828;
        }

        .btn-vol {
            background: #1DB954;
            color: white;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 20px; /* Bordes redondeados estilo Spotify */
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .btn-vol:hover {
            transform: scale(1.04);
            background: #1ed760; /* Verde más brillante al pasar el mouse */
        }

        .btn-discreto {
            background: #535353;
        }
        .btn-discreto:hover {
            background: #7a7a7a;
        }

        .contenedor-chat {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #181818;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 15px;
        }

        #caja-mensajes {
            height: 250px;
            overflow-y: auto;
            border: 1px solid #282828;
            border-radius: 6px;
            padding: 10px;
            text-align: left;
            background: #000000;
            margin-bottom: 15px;
        }

        .mensaje {
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .usuario {
            color: #1DB954;
            font-weight: bold;
        }

        .texto {
            color: #b3b3b3; /* Gris claro para los mensajes, como la interfaz de Spotify */
        }

        .controles {
            display: flex;
            gap: 10px;
        }

        input {
            background: #282828;
            border: 1px solid transparent;
            color: white;
            padding: 10px;
            border-radius: 20px;
            font-size: 1rem;
        }

        input:focus {
            outline: 1px solid #ffffff;
        }

        #userInput { width: 30%; }
        #textInput { width: 70%; }

        .contenedor-musica {
            max-width: 800px;
            margin: 20px auto;
            background: #181818;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            transition: max-height 0.4s ease-out, opacity 0.3s ease;
            overflow: hidden;
        }

        .oculto {
            max-height: 0px !important;
            padding: 0px !important;
            margin: 0px auto !important;
            border: none !important;
            opacity: 0;
        }

        .lista-videos {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .video-item {
            background: #282828;
            padding: 10px;
            border-radius: 6px;
        }

        .video-item h4 {
            margin: 0 0 8px 0;
            color: #ffffff;
            text-align: left;
            font-size: 1rem;
        }

        .video-iframe {
            width: 100%;
            height: 220px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Recomendados para ti</h1>

    <div class="contenedor-juego">
        <iframe src="https://www.hoodamath.com"></iframe>
    </div>

    <div class="barra-volumen">
        <button class="btn-vol" onclick="alert('Ajustando dispositivo de salida...')">🔉 Vol -</button>
        <button class="btn-vol" onclick="alert('Audio pausado.')">🔇 Mutar</button>
        <button class="btn-vol" onclick="alert('Incrementando buffer...')">🔊 Vol +</button>
        <button class="btn-vol btn-discreto" onclick="alternarMusica()">🎵 Ocultar Listas</button>
    </div>

    <div class="contenedor-chat">
        <div id="caja-mensajes"></div>

        <div class="controles">
            <input type="text" id="userInput" placeholder="Nombre de usuario...">
            <input type="text" id="textInput" placeholder="Añadir un comentario a la playlist...">
        </div>
    </div>

    <div class="contenedor-musica" id="seccionMusica">
        <h3 style="color: #ffffff; margin-top: 0; margin-bottom: 5px;">Player Sync</h3>
         
        <div class="lista-videos">
            <div class="video-item">
                <h4>Mix Escuchado Recientemente 1</h4>
                <iframe class="video-iframe" src="https://www.youtube.com/embed/UaFCPHwZMpI" allowfullscreen></iframe>
            </div>
            <div class="video-item">
                <h4>Mix Escuchado Recientemente 2</h4>
                <iframe class="video-iframe" src="https://www.youtube.com/embed/SFVQkYTE5xQ" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        function alternarMusica() {
            var el = document.getElementById("seccionMusica");
            el.classList.toggle("oculto");
        }

        // Tu Firebase original sigue aquí para que el chat funcione
        const firebaseConfig = {
            apiKey: "AIzaSyDcLm48oGpY4-gF-VBPwOcfTSHniWQ_KSI",
            authDomain: "pagina-yellow.firebaseapp.com",
            databaseURL: "https://pagina-yellow-default-rtdb.firebaseio.com",
            projectId: "pagina-yellow",
            storageBucket: "pagina-yellow.appspot.com",
            messagingSenderId: "908196257959",
            appId: "1:908196257959:web:ecf110e98ecdbe5778c812"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("mensajes_chat");

        const cajaMensajes = document.getElementById("caja-mensajes");
        const userInput = document.getElementById("userInput");
        const textInput = document.getElementById("textInput");

        window.onload = function() {
            let nombreGuardado = localStorage.getItem('apodoGamer');
            if (nombreGuardado) {
                userInput.value = nombreGuardado;
                userInput.disabled = true;
            }
        };

        function enviarMensaje() {
            let usuario = userInput.value.trim() || "Anónimo";
            let textoMensaje = textInput.value.trim();
            if (!textoMensaje) return;

            if (usuario !== "Anónimo" && !localStorage.getItem('apodoGamer')) {
                localStorage.setItem('apodoGamer', usuario);
                userInput.disabled = true;
            }

            db.push({
                usuario: usuario,
                texto: textoMensaje,
                tiempo: Date.now()
            });

            textInput.value = "";
        }

        textInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") { enviarMensaje(); }
        });

        db.limitToLast(50).on("child_added", function(snapshot) {
            let datos = snapshot.val();
            if (datos.texto === '/clear-names') {
                localStorage.removeItem('apodoGamer');
                userInput.value = '';
                userInput.disabled = false;
                return;
            }
            let divMsg = document.createElement("div");
            divMsg.className = "mensaje";
            divMsg.innerHTML = `<span class="usuario">[${datos.usuario}]:</span> <span class="texto">${datos.texto}</span>`;
            cajaMensajes.appendChild(divMsg);
            cajaMensajes.scrollTop = cajaMensajes.scrollHeight;
        });
    </script>
</body>
</html>
